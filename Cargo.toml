[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dyrb/ferrumtree"

[workspace.dependencies]
ft-ntfs = { path = "crates/ft-ntfs" }
ft-index = { path = "crates/ft-index" }
ft-search = { path = "crates/ft-search" }
ft-usn = { path = "crates/ft-usn" }
ft-treemap = { path = "crates/ft-treemap" }
ft-fallback = { path = "crates/ft-fallback" }
ft-dupes = { path = "crates/ft-dupes" }
memchr = "2.7"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.bench]
inherits = "release"
