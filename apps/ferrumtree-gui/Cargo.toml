[package]
name = "ferrumtree-gui"
description = "FerrumTree disk space analyzer for Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ft-ntfs.workspace = true
ft-index.workspace = true
ft-search.workspace = true
ft-usn.workspace = true
ft-treemap.workspace = true
ft-fallback.workspace = true
ft-dupes.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_UI_Shell_Common",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
] }

[dev-dependencies]
ft-ntfs.workspace = true
